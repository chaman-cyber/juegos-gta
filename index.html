<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chamán Gaming | GTA Mobile</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    background: #050505;
    font-family: Arial, sans-serif;
    color: white;
}

body {
    overflow-x: hidden;
}

.container {
    width: 100%;
    max-width: 1000px;
    margin: auto;
}

/* ENCABEZADO */
.header {
    text-align: center;
    padding: 25px 15px 18px;
    background: #050505;
}

.logo {
    font-size: clamp(28px, 7vw, 52px);
    font-weight: 900;
    letter-spacing: 2px;
    text-shadow: 0 0 12px #ff00cc, 0 0 25px #ff00cc;
}

.subtitle {
    margin-top: 7px;
    font-size: 14px;
    letter-spacing: 2px;
    color: #ccc;
}

/* LANZADOR GTA */
.launcher {
    position: relative;
    width: 100%;
    line-height: 0;
}

.launcher img {
    width: 100%;
    height: auto;
    display: block;
}

/* BOTÓN VICE CITY */
.vice-city {
    position: absolute;
    left: 24.5%;
    top: 44.8%;
    width: 18%;
    height: 9%;
    display: block;
}

/* BOTÓN GTA III */
.gta-3 {
    position: absolute;
    left: 24.5%;
    top: 79.5%;
    width: 18%;
    height: 9%;
    display: block;
}

/* REDES */
.social {
    text-align: center;
    padding: 30px 15px 35px;
    background: #080808;
}

.social-title {
    font-size: 22px;
    font-weight: bold;
    margin-bottom: 20px;
    letter-spacing: 1px;
}

.social-buttons {
    display: flex;
    justify-content: center;
    gap: 15px;
    flex-wrap: wrap;
}

.social-button {
    text-decoration: none;
    color: white;
    font-weight: bold;
    font-size: 16px;
    padding: 15px 28px;
    border-radius: 12px;
    min-width: 150px;
    display: inline-block;
    transition: transform 0.2s;
}

.social-button:active {
    transform: scale(0.95);
}

.youtube {
    background: #e60000;
    box-shadow: 0 0 18px rgba(255,0,0,0.55);
}

.tiktok {
    background: #111;
    border: 2px solid #fff;
    box-shadow: 0 0 18px rgba(255,255,255,0.25);
}

/* PIE */
.footer {
    text-align: center;
    padding: 22px 15px 30px;
    background: #050505;
    color: #888;
    font-size: 13px;
}

.footer strong {
    color: white;
}
</style>
</head>

<body>

<div class="container">

    <!-- IDENTIDAD -->
    <header class="header">
        <div class="logo">CHAMÁN GAMING</div>
        <div class="subtitle">GAMING • TECNOLOGÍA • JUEGOS</div>
    </header>

    <!-- GTA MOBILE -->
    <div class="launcher">

        <img src="https://i.postimg.cc/2CFQkbM6/file-000000008dbc820ebb827a8604f0b7e2.png"
             alt="GTA Mobile">

        <a class="vice-city"
           href="https://quenq.com/apps/vice-city/"
           target="_blank"
           aria-label="Jugar GTA Vice City">
        </a>

        <a class="gta-3"
           href="https://quenqgta.com/gta-3-online"
           target="_blank"
           aria-label="Jugar GTA III">
        </a>

    </div>

    <!-- REDES SOCIALES -->
    <section class="social">

        <div class="social-title">
            SEGUÍ A CHAMÁN GAMING
        </div>

        <div class="social-buttons">

            <a class="social-button youtube"
               href="https://youtube.com/@chamansito.10"
               target="_blank">
                ▶ YouTube
            </a>

            <a class="social-button tiktok"
               href="https://www.tiktok.com/@chaman.10"
               target="_blank">
                ♪ TikTok
            </a>

        </div>

    </section>

    <!-- PIE -->
    <footer class="footer">
        <strong>Chamán Gaming</strong><br>
        Gaming, tecnología y mucho más.
    </footer>

</div>

</body>
</html>
